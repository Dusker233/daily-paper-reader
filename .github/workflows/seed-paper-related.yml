name: seed-paper-related

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Seed paper request id"
        required: true
      request_path:
        description: "Repo path to request JSON"
        required: true
      seed_mode:
        description: "Requested read mode: skim/deep/both"
        required: false
        default: "skim"

permissions:
  contents: read

concurrency:
  group: seed-paper-related-${{ github.event.inputs.request_id }}
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: workflow-repo
          persist-credentials: false

      - name: Checkout publish branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: publish-repo
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps (skip sqlite3)
        working-directory: workflow-repo
        run: |
          python3 - <<'PY'
          import re
          lines = open("requirements.txt", "r", encoding="utf-8").read().splitlines()
          lines = [l for l in lines if l.strip() and not re.match(r"^sqlite3\b", l)]
          open("/tmp/req.txt", "w", encoding="utf-8").write("\n".join(lines))
          PY
          python3 -m pip install --upgrade pip
          python3 -m pip install uv
          uv pip install --system -r /tmp/req.txt

      - name: Validate request inputs
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          REQUEST_PATH: ${{ github.event.inputs.request_path }}
          SEED_MODE: ${{ github.event.inputs.seed_mode }}
          REQUEST_ROOT: ${{ github.workspace }}/publish-repo
        run: |
          set -euo pipefail
          export REQUEST_ID REQUEST_PATH SEED_MODE REQUEST_ROOT
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path, PurePosixPath

          request_id = (os.environ.get("REQUEST_ID") or "").strip()
          request_path = (os.environ.get("REQUEST_PATH") or "").strip()
          seed_mode = (os.environ.get("SEED_MODE") or "skim").strip()
          request_root = Path(os.environ["REQUEST_ROOT"]).resolve()

          if not request_id:
            raise SystemExit("Missing request_id")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", request_id):
            raise SystemExit(f"Unexpected request_id: {request_id}")
          if not request_path:
            raise SystemExit("Missing request_path")

          expected_request_path = f"archive/seed-papers/{request_id}/request.json"
          if request_path != expected_request_path:
            raise SystemExit(f"Unexpected request path: {request_path}")
          if PurePosixPath(request_path).parts != tuple(expected_request_path.split("/")):
            raise SystemExit(f"Unexpected request path: {request_path}")
          if seed_mode not in {"skim", "deep", "both"}:
            raise SystemExit(f"Unsupported seed mode: {seed_mode}")

          resolved_request_path = request_root.joinpath(*PurePosixPath(request_path).parts).resolve()
          if request_root not in resolved_request_path.parents:
            raise SystemExit(f"Unexpected request path: {request_path}")
          if not resolved_request_path.is_file():
            raise SystemExit(f"Missing request payload: {request_path}")

          try:
            request_payload = json.loads(resolved_request_path.read_text(encoding="utf-8")) or {}
          except json.JSONDecodeError as exc:
            raise SystemExit(f"Invalid request payload JSON: {request_path}: {exc}") from exc

          source_path = (request_payload.get("source_path") or "").strip()
          relative_pdf_path = PurePosixPath(source_path)
          expected_source_prefix = PurePosixPath("archive") / "seed-papers" / request_id
          if (
            relative_pdf_path.is_absolute()
            or relative_pdf_path.parent != expected_source_prefix
            or relative_pdf_path.suffix.lower() != ".pdf"
          ):
            raise SystemExit(f"Unexpected source_path: {source_path}")
          if any(part in {"", ".", ".."} for part in relative_pdf_path.parts):
            raise SystemExit(f"Unexpected source_path: {source_path}")

          resolved_source_path = request_root.joinpath(*relative_pdf_path.parts).resolve()
          if request_root not in resolved_source_path.parents:
            raise SystemExit(f"Unexpected source_path: {source_path}")
          if not resolved_source_path.is_file():
            raise SystemExit(f"Missing seed PDF: {source_path}")
          if resolved_source_path.stat().st_size > 50 * 1024 * 1024:
            raise SystemExit(f"Seed PDF too large: {source_path}")
          pdf_header = resolved_source_path.read_bytes()[:5]
          if pdf_header != b"%PDF-":
            raise SystemExit(f"Invalid PDF signature: {source_path}")
          PY

      - name: Inspect request payload
        env:
          REQUEST_PATH: ${{ github.event.inputs.request_path }}
          REQUEST_ROOT: ${{ github.workspace }}/publish-repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath

          request_root = Path(os.environ["REQUEST_ROOT"]).resolve()
          request_path = request_root.joinpath(*PurePosixPath(os.environ["REQUEST_PATH"]).parts)
          try:
            data = json.loads(request_path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
            raise SystemExit(f"Invalid request payload JSON: {os.environ['REQUEST_PATH']}: {exc}") from exc
          print("Loaded seed paper request:")
          print(json.dumps({
              "file_name": data.get("file_name"),
              "source_path": data.get("source_path"),
              "related_count": data.get("related_count"),
              "mode": data.get("mode"),
              "selected_tags": data.get("selected_tags"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Process seed paper request
        working-directory: workflow-repo
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          REQUEST_PATH: ${{ github.event.inputs.request_path }}
          SEED_MODE: ${{ github.event.inputs.seed_mode }}
          REQUEST_ROOT: ${{ github.workspace }}/publish-repo
          PUBLISH_ROOT: ${{ github.workspace }}/publish-repo
          WORKFLOW_ROOT: ${{ github.workspace }}/workflow-repo
          ARTIFACT_ROOT: ${{ runner.temp }}/trusted-seed-publish
          DPR_ENABLE_MULTI_SOURCE_RPC: "true"
          DPR_MULTI_SOURCE_BM25_RPC: match_multi_source_papers_bm25
          DPR_MULTI_SOURCE_VECTOR_RPC_EXACT: match_multi_source_papers_exact
          BLT_API_KEY: ${{ secrets.BLT_API_KEY }}
          BLT_PRIMARY_BASE_URL: ${{ secrets.BLT_PRIMARY_BASE_URL }}
          BLT_API_BASE: ${{ secrets.BLT_API_BASE }}
          BLT_REWRITE_MODEL: ${{ secrets.BLT_REWRITE_MODEL }}
          BLT_FILTER_MODEL: ${{ secrets.BLT_FILTER_MODEL }}
          LLM_PRIMARY_BASE_URL: ${{ secrets.LLM_PRIMARY_BASE_URL }}
          GPTBEST_BASE_URL: ${{ secrets.GPTBEST_BASE_URL }}
          WORKFLOW_LLM_API_KEY: ${{ secrets.WORKFLOW_LLM_API_KEY }}
          WORKFLOW_LLM_BASE_URL: ${{ secrets.WORKFLOW_LLM_BASE_URL }}
          WORKFLOW_LLM_MODEL: ${{ secrets.WORKFLOW_LLM_MODEL }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
          BLT_RERANK_MODEL: qwen3-reranker-4b
          RERANK_ENABLED: ${{ secrets.RERANK_ENABLED }}
          RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
          RERANK_BASE_URL: ${{ secrets.RERANK_BASE_URL }}
          RERANK_MODEL: ${{ secrets.RERANK_MODEL }}
        run: |
          set -euo pipefail
          rm -rf "${ARTIFACT_ROOT}"
          mkdir -p "${ARTIFACT_ROOT}"
          python3 - <<'PY'
          import os

          truthy_values = {"1", "true", "yes", "on"}
          falsey_values = {"0", "false", "no", "off"}

          raw_enabled = os.getenv("RERANK_ENABLED")
          state = ""
          if raw_enabled is not None:
              value = str(raw_enabled).strip().lower()
              if value in truthy_values:
                  state = "true"
              elif value in falsey_values:
                  state = "false"
              elif value:
                  raise SystemExit("Unsupported RERANK_ENABLED value for hosted seed workflow.")

          dedicated = [
              str(os.getenv(name) or "").strip()
              for name in ("RERANK_API_KEY", "RERANK_BASE_URL", "RERANK_MODEL")
          ]
          has_any_dedicated = any(dedicated)
          has_complete_dedicated = all(dedicated)
          if (state == "true" or has_any_dedicated) and not has_complete_dedicated:
              raise SystemExit("Dedicated rerank secrets are incomplete for hosted seed workflow.")
          PY
          python3 "${WORKFLOW_ROOT}/src/seed_paper_processor.py" \
            --request-path "${PUBLISH_ROOT}/${REQUEST_PATH}" \
            --request-id "$REQUEST_ID" \
            --root-dir "$PUBLISH_ROOT" \
            --docs-dir "${ARTIFACT_ROOT}/docs" \
            --seed-mode "$SEED_MODE"

      - name: Validate generated seed docs
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          ARTIFACT_ROOT: ${{ runner.temp }}/trusted-seed-publish
        run: |
          set -euo pipefail
          WORKSPACE_DIR="${ARTIFACT_ROOT}/docs/seed-papers/${REQUEST_ID}"
          echo "=== WORKSPACE_DIR ==="
          echo "${WORKSPACE_DIR}"
          test -f "${WORKSPACE_DIR}/index.md"
          test -f "${WORKSPACE_DIR}/seed-paper.md"
          shopt -s nullglob
          echo "=== related/ directory contents ==="
          ls -la "${WORKSPACE_DIR}/related/" || true
          echo "=== index.md link references ==="
          grep -E "#/seed-papers" "${WORKSPACE_DIR}/index.md" || true
          echo "=== index.md content ==="
          head -20 "${WORKSPACE_DIR}/index.md"
          related_pages=("${WORKSPACE_DIR}/related/"*.md)
          if [ "${#related_pages[@]}" -lt 1 ]; then
            echo "Seed workflow produced no related pages." >&2
            exit 1
          fi
          # New hash route contract (replacing old .md relative links)
          grep -q "#/seed-papers/${REQUEST_ID}/seed-paper" "${WORKSPACE_DIR}/index.md"
          grep -q "#/seed-papers/${REQUEST_ID}/related/" "${WORKSPACE_DIR}/index.md"

      - name: Prepare trusted publish artifact
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          REQUEST_ROOT: ${{ github.workspace }}/publish-repo
          ARTIFACT_ROOT: ${{ runner.temp }}/trusted-seed-publish
        run: |
          set -euo pipefail
          export REQUEST_ID REQUEST_ROOT ARTIFACT_ROOT
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath

          request_id = os.environ["REQUEST_ID"]
          request_root = Path(os.environ["REQUEST_ROOT"]).resolve()
          artifact_root = Path(os.environ["ARTIFACT_ROOT"]).resolve()
          docs_root = artifact_root / "docs"
          workspace_dir = docs_root / "seed-papers" / request_id
          if not workspace_dir.is_dir():
            raise SystemExit(f"Missing docs workspace for artifact packaging: {workspace_dir}")

          request_relative_path = PurePosixPath("archive") / "seed-papers" / request_id / "request.json"
          request_path = request_root.joinpath(*request_relative_path.parts).resolve()
          if request_root not in request_path.parents or not request_path.is_file():
            raise SystemExit(f"Missing archived request for artifact packaging: {request_relative_path}")
          request_bytes = request_path.read_bytes()
          try:
            request_payload = json.loads(request_bytes.decode("utf-8")) or {}
          except json.JSONDecodeError as exc:
            raise SystemExit(f"Invalid archived request for artifact packaging: {exc}") from exc
          source_relative_path = PurePosixPath(str(request_payload.get("source_path") or "").strip())
          if source_relative_path.is_absolute() or any(part in {"", ".", ".."} for part in source_relative_path.parts):
            raise SystemExit(f"Unexpected archived source_path for artifact packaging: {source_relative_path}")
          source_path = request_root.joinpath(*source_relative_path.parts).resolve()
          if request_root not in source_path.parents or not source_path.is_file():
            raise SystemExit(f"Missing archived source PDF for artifact packaging: {source_relative_path}")

          for txt_path in workspace_dir.rglob("*.txt"):
            txt_path.unlink()
          for stray_path in (docs_root / "README.md", docs_root / "_sidebar.md"):
            if stray_path.exists():
              stray_path.unlink()

          doc_hashes = {}
          for doc_path in sorted(workspace_dir.rglob("*.md")):
            if not doc_path.is_file():
              continue
            relative_doc_path = doc_path.relative_to(artifact_root).as_posix()
            doc_hashes[relative_doc_path] = hashlib.sha256(doc_path.read_bytes()).hexdigest()

          manifest_path = artifact_root / "manifest.json"
          manifest_path.write_text(
              json.dumps(
                  {
                      "request_id": request_id,
                      "request_path": request_relative_path.as_posix(),
                      "request_sha256": hashlib.sha256(request_bytes).hexdigest(),
                      "source_path": source_relative_path.as_posix(),
                      "source_sha256": hashlib.sha256(source_path.read_bytes()).hexdigest(),
                      "docs_workspace": f"docs/seed-papers/{request_id}",
                      "doc_hashes": doc_hashes,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload trusted publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: trusted-seed-publish
          path: ${{ runner.temp }}/trusted-seed-publish
          if-no-files-found: error
