name: daily-paper-reader

on:
  schedule:
    - cron: "30 18 * * *" # 北京时间次日 02:30（UTC 18:30）
  workflow_dispatch:
    inputs:
      run_enrich:
        description: "Run 0.enrich_config_queries.py（默认关闭，按需开启）"
        required: false
        default: "false"
      fetch_days:
        description: "回溯抓取天数（例如 30）；留空则使用默认配置"
        required: false
        default: "10"
      fetch_mode:
        description: "抓取模式：auto/standard/skims（auto 按 fetch-days 阈值决定，standard/ skims 强制）"
        required: false
        default: "auto"
      profile_tag:
        description: "仅运行指定词条 tag；留空表示全量运行"
        required: false
        default: ""
      filter_concurrency:
        description: "Step 4 LLM refine 并发数；留空则使用默认值"
        required: false
        default: "2"
      rerank_provider:
        description: "(Optional) Set RERANK_PROVIDER: local/blt/none (for smoke test)"
        required: false
        default: ""
      rerank_model:
        description: "(Optional) Allowed local rerank model when rerank_provider=local"
        required: false
        default: "BAAI/bge-reranker-v2-m3"
      seed_smoke:
        description: "Run seed paper smoke validation on hosted Actions"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: daily-paper-reader
  cancel-in-progress: false

jobs:
  run:
    if: github.event.inputs.seed_smoke != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    env:
      DPR_EMBED_API_TIMEOUT: "60"
      DPR_SITE_URL: ${{ vars.SITE_URL || 'https://your-domain.com' }}
      PYTHONUNBUFFERED: "1"
      RERANK_PROVIDER: ${{ github.event.inputs.rerank_provider || '' }}
      RERANK_MODEL: ${{ github.event.inputs.rerank_model || '' }}
    steps:
      - name: Random delay to spread scheduled runs
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(shuf -i 0-3599 -n 1)
          echo "Sleeping ${DELAY}s (≈$((DELAY/60))min) to stagger fork runs over 1 hour …"
          sleep $DELAY

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Python deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
            ~/.cache/torch
            ~/.cache/dpr-tools/pdffigures2
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-dpr-embed-deps-v1-${{ hashFiles('requirements.txt') }}

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/hf_cache
          key: ${{ runner.os }}-hf-cache-v1-${{ hashFiles('requirements.txt') }}

      - name: Install deps (skip sqlite3)
        run: |
          python - <<'PY'
          import re
          lines = open("requirements.txt", "r", encoding="utf-8").read().splitlines()
          lines = [l for l in lines if l.strip() and not re.match(r"^sqlite3\\b", l)]
          open("/tmp/req.txt", "w", encoding="utf-8").write("\n".join(lines))
          PY
          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system -r /tmp/req.txt

      - name: Resolve local rerank runtime
        if: env.RERANK_PROVIDER == 'local'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          requested = str(os.getenv("RERANK_LOCAL_DEVICE") or os.getenv("DPR_RERANK_DEVICE") or "").strip()
          if requested:
            device = requested
            print(f"[INFO] using preset local rerank device={device}")
          else:
            device = "cpu"
            print(f"[INFO] hosted workflow forces local rerank device={device}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
            fh.write(f"RERANK_LOCAL_DEVICE={device}\n")
            fh.write(f"DPR_RERANK_DEVICE={device}\n")
          PY

      - name: Local reranker smoke test (optional)
        if: env.RERANK_PROVIDER == 'local'
        env:
          HF_HOME: ${{ github.workspace }}/hf_cache
          HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/hf_cache
          HF_HUB_DISABLE_SYMLINKS: "1"
          RERANK_PROVIDER: ${{ env.RERANK_PROVIDER }}
          RERANK_MODEL: ${{ env.RERANK_MODEL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "src")
          from llm import ClientFactory

          allowed_models = {"BAAI/bge-reranker-v2-m3"}
          model = os.getenv("RERANK_MODEL") or "BAAI/bge-reranker-v2-m3"
          if model not in allowed_models:
            raise SystemExit(f"Unsupported local rerank model: {model}")

          client = ClientFactory.from_env(scope="rerank")
          assert getattr(client, "provider", "") == "local"
          assert hasattr(client, "rerank")
          client.batch_size = 2
          print(f"Using local rerank device: {getattr(client, 'device', '<unknown>')}")
          out = client.rerank("test query", ["doc A", "doc B"], top_n=2)
          assert "results" in out and len(out["results"]) == 2, out
          assert out["results"][0]["index"] in (0, 1)
          assert isinstance(out["results"][0]["relevance_score"], float)
          print("OK: local reranker factory path loaded and produced scores")
          PY

      - name: Prepare pdffigures2
        run: |
          set -euo pipefail

          TOOL_DIR="$HOME/.cache/dpr-tools/pdffigures2"
          SRC_DIR="$TOOL_DIR/src"
          JAR_PATH="$TOOL_DIR/pdffigures2.jar"

          mkdir -p "$TOOL_DIR"
          if [ ! -f "$JAR_PATH" ]; then
            rm -rf "$SRC_DIR"
            git clone --depth 1 https://github.com/allenai/pdffigures2 "$SRC_DIR"
            cd "$SRC_DIR"
            curl -fsSL -o sbt.tgz https://github.com/sbt/sbt/releases/download/v1.10.1/sbt-1.10.1.tgz
            tar -xzf sbt.tgz
            ./sbt/bin/sbt assembly
            cp pdffigures2.jar "$JAR_PATH"
          fi

          echo "PDFFIGURES2_JAR=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Run Retrieval and Embedding
        env:
          BLT_API_KEY: ${{ secrets.BLT_API_KEY }}
          BLT_REWRITE_MODEL: ${{ secrets.BLT_REWRITE_MODEL }}
          BLT_RERANK_MODEL: qwen3-reranker-4b
          BLT_FILTER_MODEL: ${{ secrets.BLT_FILTER_MODEL }}
          LLM_PRIMARY_BASE_URL: ${{ secrets.LLM_PRIMARY_BASE_URL }}
          BLT_PRIMARY_BASE_URL: ${{ secrets.BLT_PRIMARY_BASE_URL }}
          BLT_API_BASE: ${{ secrets.BLT_PRIMARY_BASE_URL }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
          HF_HOME: ${{ github.workspace }}/hf_cache
          HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/hf_cache
          HF_HUB_DISABLE_SYMLINKS: "1"
        run: |
          REQUESTED_RERANK_PROVIDER="${RERANK_PROVIDER:-}"
          REQUESTED_RERANK_MODEL="${RERANK_MODEL:-}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] && [ -z "$REQUESTED_RERANK_PROVIDER" ]; then
            REQUESTED_RERANK_PROVIDER="none"
          elif [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ -z "$REQUESTED_RERANK_PROVIDER" ]; then
            REQUESTED_RERANK_PROVIDER="blt"
          fi
          case "$REQUESTED_RERANK_PROVIDER" in
            "blt")
              export RERANK_PROVIDER="blt"
              export RERANK_MODEL="${BLT_RERANK_MODEL:-qwen3-reranker-4b}"
              export RERANK_API_KEY="$BLT_API_KEY"
              export RERANK_BASE_URL="${BLT_PRIMARY_BASE_URL:-$BLT_API_BASE}"
              unset RERANK_ENABLED
              ;;
            "local")
              export RERANK_PROVIDER="local"
              export RERANK_MODEL="${REQUESTED_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"
              unset RERANK_ENABLED
              unset RERANK_API_KEY
              unset RERANK_BASE_URL
              ;;
            ""|"none")
              export RERANK_PROVIDER="none"
              export RERANK_ENABLED="false"
              unset RERANK_MODEL
              unset RERANK_API_KEY
              unset RERANK_BASE_URL
              ;;
            *)
              echo "Unsupported rerank provider: $REQUESTED_RERANK_PROVIDER" >&2
              exit 1
              ;;
          esac

          echo "--- rerank env (sanitized) ---"
          echo "requested_provider=${REQUESTED_RERANK_PROVIDER:-<empty>}"
          echo "effective_provider=${RERANK_PROVIDER:-<empty>}"
          echo "effective_model=${RERANK_MODEL:-<empty>}"
          echo "rerank_api_key_present=$([ -n "${RERANK_API_KEY:-}" ] && echo yes || echo no)"
          echo "rerank_base_url_present=$([ -n "${RERANK_BASE_URL:-}" ] && echo yes || echo no)"

          echo "Keeping HF cache between runs (actions/cache handles this)."

          echo "=== Debug: runtime env ==="
          echo "PWD=$(pwd)"
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "HF_HOME=$HF_HOME"
          echo "HUGGINGFACE_HUB_CACHE=$HUGGINGFACE_HUB_CACHE"
          echo "HF_HUB_DISABLE_SYMLINKS=$HF_HUB_DISABLE_SYMLINKS"
          echo "TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE:-<unset>}"
          echo "XDG_CACHE_HOME=${XDG_CACHE_HOME:-<unset>}"
          echo "--- python/hf versions ---"
          python - <<'PY'
          import os
          def v(mod):
            try:
              m = __import__(mod)
              return getattr(m, "__version__", "<no __version__>")
            except Exception as e:
              return f"<import failed: {e}>"

          print("python_exe:", os.environ.get("PYTHON", ""))
          print("HF_HOME env:", os.environ.get("HF_HOME"))
          print("HUGGINGFACE_HUB_CACHE env:", os.environ.get("HUGGINGFACE_HUB_CACHE"))
          print("HF_HUB_DISABLE_SYMLINKS env:", os.environ.get("HF_HUB_DISABLE_SYMLINKS"))
          print("TRANSFORMERS_CACHE env:", os.environ.get("TRANSFORMERS_CACHE"))
          print("versions:", {
            "huggingface_hub": v("huggingface_hub"),
            "transformers": v("transformers"),
            "sentence_transformers": v("sentence_transformers"),
          })
          try:
            from huggingface_hub import constants as c
            print("hub.constants:", {
              "HF_HOME": getattr(c, "HF_HOME", None),
              "HUGGINGFACE_HUB_CACHE": getattr(c, "HUGGINGFACE_HUB_CACHE", None),
              "HF_HUB_DISABLE_SYMLINKS": getattr(c, "HF_HUB_DISABLE_SYMLINKS", None),
            })
          except Exception as e:
            print("hub.constants import failed:", e)
          PY

          echo "--- cache dir check ---"
          echo "[legacy] ~/.cache/huggingface:"
          ls -la ~/.cache/huggingface || true
          echo "[current] $HF_HOME:"
          ls -la "$HF_HOME" || true

          echo "Running main script..."
          RUN_ENRICH="${{ github.event.inputs.run_enrich }}"
          FETCH_DAYS="${{ github.event.inputs.fetch_days }}"
          FETCH_MODE="${{ github.event.inputs.fetch_mode }}"
          PROFILE_TAG="${{ github.event.inputs.profile_tag }}"
          FILTER_CONCURRENCY="${{ github.event.inputs.filter_concurrency }}"
          ARGS=()
          if [ "$RUN_ENRICH" = "true" ]; then
            ARGS+=(--run-enrich)
          fi
          if [ -n "$FETCH_DAYS" ]; then
            ARGS+=(--fetch-days "$FETCH_DAYS")
          fi
          if [ -n "$FETCH_MODE" ]; then
            ARGS+=(--fetch-mode "$FETCH_MODE")
          fi
          if [ -n "$PROFILE_TAG" ]; then
            ARGS+=(--profile-tag "$PROFILE_TAG")
          fi
          if [ -n "$FILTER_CONCURRENCY" ]; then
            ARGS+=(--filter-concurrency "$FILTER_CONCURRENCY")
          fi
          python src/main.py "${ARGS[@]}" --embedding-device cpu --embedding-batch-size 8

          # 让前端可以在不配置 GitHub Token 的情况下直接读取配置（只读快照）
          cp -f config.yaml docs/config.yaml

          echo "--- post-run cache symlink check ---"
          find "$HF_HOME" -xtype l | head -n 50 || true

      - name: Cleanup non-recommend archives
        run: |
          find archive -mindepth 2 -maxdepth 2 -type d \( -name raw -o -name filtered -o -name rank \) -exec rm -rf {} +

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"

          shopt -s nullglob
          paths=(docs config.yaml)
          if [ -f archive/arxiv_seen.json ]; then
            paths+=(archive/arxiv_seen.json)
          fi
          if [ -f archive/crawl_state.json ]; then
            paths+=(archive/crawl_state.json)
          fi
          if [ -f archive/carryover.json ]; then
            paths+=(archive/carryover.json)
          fi
          for d in archive/*/recommend; do
            paths+=("$d")
          done

          git add "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[chore] daily pipeline"

          git fetch origin "$branch"
          git rebase -X theirs "origin/$branch"
          git push origin HEAD:"$branch"

  seed_smoke:
    if: github.event.inputs.seed_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps (skip sqlite3)
        run: |
          python - <<'PY'
          import re
          lines = open("requirements.txt", "r", encoding="utf-8").read().splitlines()
          lines = [l for l in lines if l.strip() and not re.match(r"^sqlite3\\b", l)]
          open("/tmp/req.txt", "w", encoding="utf-8").write("\n".join(lines))
          PY
          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system -r /tmp/req.txt

      - name: Run seed paper processor unit tests
        run: |
          python -m unittest tests.test_seed_paper_processor tests.test_seed_paper_workflow tests.test_daily_workflow

      - name: Run seed workflow frontend tests
        run: |
          node tests/test_subscriptions_github_token.js
          node tests/test_subscriptions_manager.js

      - name: Create seed smoke fixtures
        run: |
          set -euo pipefail
          REQUEST_ID="seed-smoke-request"
          REQUEST_DIR="archive/seed-papers/${REQUEST_ID}"
          mkdir -p "$REQUEST_DIR"
          python - <<'PY'
          import fitz
          from pathlib import Path

          request_dir = Path("archive/seed-papers/seed-smoke-request")
          pdf_path = request_dir / "seed-paper.pdf"
          doc = fitz.open()
          page = doc.new_page()
          page.insert_text((72, 72), "Seed smoke paper for hosted CI validation")
          doc.save(pdf_path)
          doc.close()
          PY
          python - <<'PY'
          import json
          from pathlib import Path

          request_dir = Path("archive/seed-papers/seed-smoke-request")
          request_path = request_dir / "request.json"
          request_path.write_text(
              json.dumps(
                  {
                      "file_name": "seed-paper.pdf",
                      "source_path": "archive/seed-papers/seed-smoke-request/seed-paper.pdf",
                      "related_count": 2,
                      "selected_tags": ["seed", "smoke"],
                      "mode": "both",
                      "notes": "Hosted GitHub Actions seed smoke validation",
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          fixture_path = request_dir / "ranked-related.json"
          fixture_path.write_text(
              json.dumps(
                  [
                      {
                          "id": "fixture-related-1",
                          "title": "Fixture Related One",
                          "abstract": "First hosted fixture abstract.",
                          "link": "https://arxiv.org/abs/2401.00001",
                          "llm_tags": ["query:seed", "query:smoke"],
                          "llm_score": 0.95,
                      },
                      {
                          "id": "fixture-related-2",
                          "title": "Fixture Related Two",
                          "abstract": "Second hosted fixture abstract.",
                          "link": "https://openreview.net/forum?id=seed-smoke-fixture",
                          "llm_tags": ["query:seed", "query:smoke"],
                          "llm_score": 0.88,
                      },
                  ],
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Run seed paper smoke flow
        run: |
          set -euo pipefail
          REQUEST_ID="seed-smoke-request"
          REQUEST_PATH="archive/seed-papers/${REQUEST_ID}/request.json"
          FIXTURE_PATH="archive/seed-papers/${REQUEST_ID}/ranked-related.json"
          python src/seed_paper_processor.py \
            --request-path "$REQUEST_PATH" \
            --request-id "$REQUEST_ID" \
            --seed-mode both \
            --ranked-related-fixture "$FIXTURE_PATH"
          test -f "docs/seed-papers/${REQUEST_ID}/index.md"
          test -f "docs/seed-papers/${REQUEST_ID}/seed-paper.md"
          test -f "docs/seed-papers/${REQUEST_ID}/related/fixture-related-1.md"
          test -f "docs/seed-papers/${REQUEST_ID}/related/fixture-related-2.md"
          grep -q "Fixture Related One" "docs/seed-papers/${REQUEST_ID}/index.md"
          test -f "docs/README.md"
          test -f "docs/_sidebar.md"

      - name: Upload seed smoke docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-smoke-docs
          path: |
            docs/seed-papers/seed-smoke-request
            docs/README.md
            docs/_sidebar.md
