name: seed-paper-deep-single

# 单篇论文转精读：从 skim 页升级到 deep summary
# 由前端 "转精读" button 触发，输入为 docs/{date}/{paper_id}.md

on:
  workflow_dispatch:
    inputs:
      paper_path:
        description: "Paper markdown path, e.g. docs/20260417/2503.01012.md"
        required: true
      branch:
        description: "Branch to update"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: seed-paper-deep-single-${{ github.event.inputs.paper_path }}
  cancel-in-progress: true

jobs:
  upgrade-deep:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate paper_path
        run: |
          set -euo pipefail
          paper_path="${{ github.event.inputs.paper_path }}"
          if ! echo "$paper_path" | grep -qE '^docs/[0-9]{8}/[a-zA-Z0-9._-]+\.md$'; then
            echo "ERROR: Invalid paper_path format: $paper_path"
            echo "Expected: docs/YYYYMMDD/paper-id.md"
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.branch || 'main' }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install uv
          uv pip install --system openai pymupdf arxiv numpy

      - name: Run deep summary upgrade for single paper
        env:
          PAPER_PATH: ${{ github.event.inputs.paper_path }}
          WORKFLOW_ROOT: ${{ github.workspace }}
          LLM_PRIMARY_BASE_URL: ${{ secrets.LLM_PRIMARY_BASE_URL }}
          WORKFLOW_LLM_API_KEY: ${{ secrets.WORKFLOW_LLM_API_KEY }}
          WORKFLOW_LLM_BASE_URL: ${{ secrets.WORKFLOW_LLM_BASE_URL }}
          WORKFLOW_LLM_MODEL: ${{ secrets.WORKFLOW_LLM_MODEL }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
        run: |
          set -euo pipefail
          cd "$WORKFLOW_ROOT"
          python3 - <<'PY'
          import os
          import sys
          import re
          import subprocess

          paper_path = os.environ["PAPER_PATH"]
          workspace = os.environ["WORKFLOW_ROOT"]

          md_file = os.path.join(workspace, paper_path)
          if not os.path.isfile(md_file):
              print(f"ERROR: Paper file not found: {paper_path}")
              sys.exit(1)

          # Derive txt path: docs/20260417/2503.01012.md -> docs/20260417/2503.01012.txt
          txt_file = md_file[:-3] + ".txt"
          if not os.path.isfile(txt_file):
              print(f"WARNING: Txt file not found: {txt_file}")
              txt_file = ""

          print(f"Processing paper: {paper_path}")
          print(f"  md: {md_file}")
          print(f"  txt: {txt_file}")

          # Import the generate_docs module
          sys.path.insert(0, os.path.join(workspace, "src"))
          import importlib.util
          spec = importlib.util.spec_from_file_location("generate_docs", os.path.join(workspace, "src", "6.generate_docs.py"))
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          # Generate deep summary
          if txt_file:
              summary = mod.generate_deep_summary(md_file, txt_file, max_retries=2)
          else:
              summary = None
              print("WARNING: Skipping deep summary (no txt file)")

          if summary:
              # Upsert the deep summary block into markdown
              mod.upsert_auto_block(md_file, "论文详细总结（自动生成）", summary)
              print(f"Deep summary written to: {paper_path}")
          else:
              print("WARNING: No deep summary generated")

          print("Done.")
          PY

      - name: Commit and push changes
        run: |
          set -euo pipefail
          cd "$WORKFLOW_ROOT"
          paper_path="${{ github.event.inputs.paper_path }}"
          branch="${{ github.event.inputs.branch || 'main' }}"

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "Claude Code Bot"
          git config user.email "noreply@anthropic.com"
          git add "$paper_path"
          git commit -m "feat: upgrade paper to deep summary (triggered by 转精读)

Co-Authored-By: Claude Code Bot <noreply@anthropic.com>"
          git push origin "HEAD:$branch"
